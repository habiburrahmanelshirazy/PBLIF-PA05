<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belanja- Stokify</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .carousel-item img {
            height: 80vh;
            object-fit: cover;
        }

        body {
            padding-top: 70px;
        }

        .navbar {
            background: linear-gradient(to right, #4be24b, #4be24b);
        }

        .bg-warning {
            background: linear-gradient(to right, #4be24b, #4be24b) !important;
            color: white;
        }

        .daftar {
            width: 100%;
            font-family: sans-serif;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .toolbar input[type="search"] {
            flex: 1;
        }

        input[type="search"],
        select {
            padding: 7px 10px;
            border: 1.5px solid #9fb8bd;
            border-radius: 6px;
        }

        .tambah {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            background: #1e6b3c;
            color: #fff;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            text-align: left;
            padding: 9px 12px;
        }

        th {
            background: #d6e6e8;
        }

        tbody tr:nth-child(odd) {
            background: #f1f7f8;
        }

        td.nama {
            font-weight: 600;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container-fluid">
            <h3><i class="fas fa-house text-white me-2"></i></h3>
            <a class="navbar-brand fw-bold" href="layout.html">STOKIFY </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto me-4">
                    <li class="nav-item"><a class="nav-link active" href="layout.html">BERANDA</a></li>
                    <li class="nav-item"><a class="nav-link active" href="hubungi.html">HUBUNGI KAMI</a></li>
                    <form class="d-flex" role="search">
                        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                        <button class="btn btn-outline-light" type="submit">Search</button>
                    </form>
                    <div class="icon mt-2 ms-3 text-white">
                        <h5>
                            <!-- Tautan ke Halaman Login -->
                            <a href="login.html" class="text-white text-decoration-none me-3" title="Login / Akun">
                                <i class="fas fa-user"></i>
                            </a>
                            <!-- Tautan ke halaman notif-->
                            <a href="notifikasi.html" class="text-white text-decoration-none me-3" title="notification">
                                <i class="fas fa-bell"></i>
                            </a>
                        </h5>
                    </div>
            </div>
        </div>
    </nav>
    <!-- Main Content -->
    <main class="container-fluid p-3 p-md-4">
        <div class="daftar">
            <h2>Daftar Belanja</h2>

            <div class="toolbar">
                <input type="search" placeholder="Cari barang belanja...">
                <label for="kategori">Kategori:</label>
                <select id="kategori">
                    <option>Semua</option>
                    <option>Bahan Makanan</option>
                    <option>Kebersihan</option>
                </select>
                <button class="tambah">+ Tambah ke Belanja</button>
            </div>
    </main>

    <div class="wrap">
        <table>
            <thead>
                <tr>
                    <th></th>
                    <th>Barang</th>
                    <th>Jumlah</th>
                    <th>Perkiraan harga</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><input type="checkbox"></td>
                    <td class="nama">Beras</td>
                    <td>5 kg</td>
                    <td>Rp 75.000</td>
                </tr>
                <tr>
                    <td><input type="checkbox"></td>
                    <td class="nama">Sabun Cuci Piring</td>
                    <td>2 botol</td>
                    <td>Rp 24.000</td>
                </tr>
                <tr>
                    <td><input type="checkbox"></td>
                    <td class="nama">Telur</td>
                    <td>1 kg</td>
                    <td>Rp 30.000</td>
                </tr>
                <tr>
                    <td><input type="checkbox"></td>
                    <td class="nama">Sabun Mandi</td>
                    <td>3 pcs</td>
                    <td>Rp 15.000</td>
                </tr>
                <tr>
                    <td><input type="checkbox"></td>
                    <td class="nama">Bumbu instan</td>
                    <td>3 pcs</td>
                    <td>Rp 15.000</td>
                </tr>
                <tr>
                    <td><input type="checkbox"></td>
                    <td class="nama">Garam</td>
                    <td>1 bungkus</td>
                    <td>Rp 6.000</td>
                </tr>
                <tr>
                    <td><input type="checkbox"></td>
                    <td class="nama">Mie instant</td>
                    <td>5 bungkus</td>
                    <td>Rp 15.000</td>
                </tr>
                <tr>
                    <td><input type="checkbox"></td>
                    <td class="nama">Gula</td>
                    <td>1 kg</td>
                    <td>Rp 21.000</td>
                </tr>
            </tbody>
        </table>
    </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
