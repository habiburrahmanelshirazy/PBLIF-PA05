<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catatan-Stokify</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .carousel-item img {
            height: 80vh;
            object-fit: cover;
        }

        body {
            padding-top: 70px;
        }

        .navbar {
            background: linear-gradient(to right, #4be24b, #4be24b);
        }

        .bg-warning {
            background: linear-gradient(to right, #4be24b, #4be24b) !important;
            color: white;
        }

        .form-barang {
            width: 100%;
            font-family: sans-serif;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
        }

        .nama,
        .kategori,
        .minimum {
            grid-column: span 2;
        }

        .catatan {
            grid-column: span 4;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 4px;
        }

        input,
        select {
            width: 100%;
            padding: 8px;
            border: 1.5px solid #9fb8bd;
            border-radius: 6px;
        }

        .aksi {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 16px;
        }

        button {
            padding: 7px 20px;
            border: 1.5px solid #9fb8bd;
            border-radius: 6px;
            background: #fffF;
            color: #1f6f78;
            cursor: pointer;
        }

        .simpan {
            background: #4be24b;
            color: #fff;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container-fluid">
            <h3><i class="fas fa-house text-white me-2"></i></h3>
            <a class="navbar-brand fw-bold" href="layout.html">STOKIFY </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto me-4">
                    <li class="nav-item"><a class="nav-link active" href="layout.html">BERANDA</a></li>
                    <li class="nav-item"><a class="nav-link active" href="hubungi.html">HUBUNGI KAMI</a></li>
                    <form class="d-flex" role="search">
                        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                        <button class="btn btn-outline-light" type="submit">Search</button>
                    </form>
                    <div class="icon mt-2 ms-3 text-white">
                        <h5>
                            <!-- Tautan ke Halaman Login -->
                            <a href="login.html" class="text-white text-decoration-none me-3" title="Login / Akun">
                                <i class="fas fa-user"></i>
                            </a>
                            <!-- Tautan ke halaman notif-->
                            <a href="notifikasi.html" class="text-white text-decoration-none me-3" title="notification">
                                <i class="fas fa-bell"></i>
                            </a>
                        </h5>
                    </div>
            </div>
        </div>
    </nav>
    <!-- Main Content -->
    <main class="container-fluid p-3 p-md-4">
        <form class="form-barang">
            <h2 class="mb-4">Form Barang</h2>

            <div class="grid">
                <div class="nama">
                    <label for="nama">Nama barang</label>
                    <input id="nama" type="text" placeholder="Beras" required>
                </div>

                <div class="kategori">
                    <label for="kategori">Kategori</label>
                    <select id="kategori">
                        <option>Bahan Makanan</option>
                        <option>Minuman</option>
                        <option>Kebersihan</option>
                        <option>Lainnya</option>
                    </select>
                </div>

                <div class="jumlah">
                    <label for="jumlah">Jumlah stok</label>
                    <input id="jumlah" type="number" min="0" placeholder="2" required>
                </div>

                <div class="satuan">
                    <label for="satuan">Satuan</label>
                    <select id="satuan">
                        <option>kg</option>
                        <option>liter</option>
                        <option>botol</option>
                        <option>pcs</option>
                    </select>
                </div>

                <div class="minimum">
                    <label for="minimum">Stok minimum</label>
                    <input id="minimum" type="number" min="0" placeholder="5">
                </div>

                <div class="catatan">
                    <label for="catatan">Catatan</label>
                    <input id="catatan" type="text" placeholder="Opsional">
                </div>
            </div>

            <div class="aksi">
                <button type="reset" class="batal btn btn-danger">Batal</button>
                <button type="submit" class="simpan">Simpan</button>
            </div>
        </form>
    </main>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/stokify-demo.js"></script>
</body>

</html>
