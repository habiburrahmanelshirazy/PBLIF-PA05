<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estimasi- Stokify</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .carousel-item img {
            height: 80vh;
            object-fit: cover;
        }

        body {
            padding-top: 70px;
        }

        .navbar {
            background: linear-gradient(to right, #4be24b, #4be24b);
        }

        .bg-warning {
            background: linear-gradient(to right, #4be24b, #4be24b) !important;
            color: white;
        }

        .estimasi {
            max-width: 1250px;
            font-family: sans-serif;
        }

        .layout {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 28px;
        }

        label {
            display: block;
            font-weight: 550;
            margin-bottom: 10px;
        }

        select {
            width: 100%;
            padding: 8px;
            margin-bottom: 14px;
            border: 1.5px solid #9fb8bd;
            border-radius: 6px;
        }

        .total {
            padding: 14px;
            text-align: center;
            background: #d6e6e8;
            border: 2px solid #4be24b;
            border-radius: 8px;
        }

        .total strong {
            display: block;
            font-size: 26px;
            color: #1a931a;
        }

        .item {
            margin-bottom: 18px;
        }

        .baris {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .bar {
            height: 10px;
            background: #eef3f4;
            border-radius: 6px;
            overflow: hidden;
        }

        .bar span {
            display: block;
            height: 100%;
            background: #4be24b;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container-fluid">
            <h3><i class="fas fa-house text-white me-2"></i></h3>
            <a class="navbar-brand fw-bold" href="layout.html">STOKIFY </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto me-4">
                    <li class="nav-item"><a class="nav-link active" href="layout.html">BERANDA</a></li>
                    <li class="nav-item"><a class="nav-link active" href="hubungi.html">HUBUNGI KAMI</a></li>
                    <form class="d-flex" role="search">
                        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                        <button class="btn btn-outline-light" type="submit">Search</button>
                    </form>
                    <div class="icon mt-2 ms-3 text-white">
                        <h5>
                            <!-- Tautan ke Halaman Login -->
                            <a href="login.html" class="text-white text-decoration-none me-3" title="Login / Akun">
                                <i class="fas fa-user"></i>
                            </a>
                            <!-- Tautan ke halaman notif-->
                            <a href="notifikasi.html" class="text-white text-decoration-none me-3" title="notification">
                                <i class="fas fa-bell"></i>
                            </a>
                        </h5>
                    </div>
            </div>
        </div>
    </nav>
    <!-- Main Content -->
    <div class="estimasi">
        <h2 class="mb-4">Estimasi Biaya Belanja</h2>

        <div class="layout">
            <div class="kiri">
                <label for="daftar">Daftar belanja</label>
                <select id="daftar">
                    <option>Belanja Minggu Ini</option>
                    <option>Belanja Bulanan</option>
                </select>

                <label for="periode">Periode</label>
                <select id="periode">
                    <option>Januari 2026</option>
                    <option>Februari 2026</option>
                    <option>Maret 2026</option>
                    <option>April 2026</option>
                    <option>Mei 2026</option>
                    <option>Juni 2026</option>
                    <option>Juli 2026</option>
                    <option>Agustus 2026</option>
                    <option>September 2026</option>
                    <option>Oktober 2026</option>
                    <option>November 2026</option>
                    <option>Desember 2026</option>
                </select>

                <div class="total">
                    <p>Estimasi Total Belanja</p>
                    <strong>Rp 144.000</strong>
                </div>
            </div>

            <div class="kanan">
                <h3>Rincian per kategori</h3>

                <div class="item">
                    <div class="baris"><span>Bahan Makanan</span><b>Rp 105.000</b></div>
                    <div class="bar"><span style="width: 100%"></span></div>
                </div>

                <div class="item">
                    <div class="baris"><span>Kebersihan</span><b>Rp 24.000</b></div>
                    <div class="bar"><span style="width: 30%"></span></div>
                </div>

                <div class="item">
                    <div class="baris"><span>Perlengkapan Mandi</span><b>Rp 15.000</b></div>
                    <div class="bar"><span style="width: 14%"></span></div>
                </div>
            </div>
        </div>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/stokify-demo.js"></script>
</body>

</html>
