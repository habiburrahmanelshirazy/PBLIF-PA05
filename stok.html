<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stok-Stokify</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .carousel-item img {
            height: 80vh;
            object-fit: cover;
        }

        body {
            padding-top: 70px;
        }

        .navbar {
            background: linear-gradient(to right, #4be24b, #4be24b);
        }

        .bg-warning {
            background: linear-gradient(to right, #4be24b, #4be24b) !important;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-family: sans-serif;
        }

        .tambah {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            background: #4be24b;
            color: #fff;
            cursor: pointer;
        }

        td {
            text-align: left;
            padding: 10px 14px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #f1f7f8;
        }

        .menipis {
            color: #b4531a;
            font-weight: 700;
        }

        .cukup {
            color: #1e6b3c;
            font-weight: 700;
        }

        button {
            padding: 5px 10px;
            border: 1px solid #1f6f78;
            border-radius: 6px;
            background: #fff;
            color: #1f6f78;
            cursor: pointer;
        }

        button.hapus {
            border-color: #c0392b;
            color: #c0392b;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container-fluid">
            <h3><i class="fas fa-house text-white me-2"></i></h3>
            <a class="navbar-brand fw-bold" href="layout.html">STOKIFY</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto me-4">
                    <li class="nav-item"><a class="nav-link active" href="layout.html">BERANDA</a></li>
                    <li class="nav-item"><a class="nav-link active" href="hubungi.html">HUBUNGI KAMI</a></li>
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                    <button class="btn btn-outline-light" type="submit">Search</button>
                </form>
                <div class="icon mt-2 ms-3 text-white">
                    <h5>
                        <a href="login.html" class="text-white text-decoration-none me-3" title="Login / Akun">
                            <i class="fas fa-user"></i>
                        </a>
                        <a href="notifikasi.html" class="text-white text-decoration-none me-3" title="notification">
                            <i class="fas fa-bell"></i>
                        </a>
                    </h5>
                </div>
            </div>
        </div>
    </nav>
    <!-- Main Content -->
    <main class="container-fluid p-3 p-md-4" style="min-height: 200px;">
        <h2 class="mb-4">Daftar Stok</h2>
        <form class="d-flex mb-4" role="search">
            <input class="form-control me-5" style="width: 500px;" type="search" placeholder="Cari barang..."
                aria-label="Search">
            <button class="btn btn-primary" type="submit">Search</button>
            <span class="text-muted me-3"></span>
            <button type="button" class="tambah">+ Tambah stok menipis ke Belanja</button>
        </form>
        <div class="wrap">
            <table>
                <thead>
                    <tr>
                        <th>Barang</th>
                        <th>Stok</th>
                        <th>Min</th>
                        <th>Status</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="nama">Beras</td>
                        <td>2 kg</td>
                        <td>5 kg</td>
                        <td><span class="badge menipis">Menipis</span></td>
                        <td><button class="ubah">Ubah</button><button class="hapus">Hapus</button></td>
                    </tr>
                    <tr>
                        <td class="nama">Minyak Goreng</td>
                        <td>3 liter</td>
                        <td>2 liter</td>
                        <td><span class="badge cukup">Cukup</span></td>
                        <td><button class="ubah">Ubah</button><button class="hapus">Hapus</button></td>
                    </tr>
                    <tr>
                        <td class="nama">Sabun Cuci Piring</td>
                        <td>1 botol</td>
                        <td>2 botol</td>
                        <td><span class="badge menipis">Menipis</span></td>
                        <td><button class="ubah">Ubah</button><button class="hapus">Hapus</button></td>
                    </tr>
                    <tr>
                        <td class="nama">Gula Pasir</td>
                        <td>5 kg</td>
                        <td>3 kg</td>
                        <td><span class="badge cukup">Cukup</span></td>
                        <td><button class="ubah">Ubah</button><button class="hapus">Hapus</button></td>
                    <tr>
                        <td class="nama">Mie Instan</td>
                        <td>8 bungkus</td>
                        <td>10 bungkus</td>
                        <td><span class="badge menipis">Menipis</span></td>
                        <td><button class="ubah">Ubah</button><button class="hapus">Hapus</button></td>
                    </tr>
                    <tr>
                        <td class="nama">Telor Ayam</td>
                        <td>25 butir</td>
                        <td>20 butir</td>
                        <td><span class="badge cukup">Cukup</span></td>
                        <td><button class="ubah">Ubah</button><button class="hapus">Hapus</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/stokify-demo.js"></script>
</body>

</html>
