<!DOCTYPE html>
<html lang="id"><head><script src="admin.js"></script><script>document.write(HEAD('Kelola Stok'))</script></head>
<body>
<div id="topnav"></div>
<div class="admin-wrap"><aside class="admin-side" id="side"></aside>
<main class="admin-main">
 <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3"><h3 class="mb-0">Kelola Stok</h3>
  <button class="btn btn-hijau" onclick="openForm()"><i class="fas fa-plus"></i> Tambah Barang</button></div>
 <div class="row g-2 mb-3">
  <div class="col-md-6"><input id="q" class="form-control" placeholder="Cari barang..." oninput="render()"></div>
  <div class="col-md-3"><select id="fk" class="form-select" onchange="render()"></select></div>
  <div class="col-md-3"><select id="fs" class="form-select" onchange="render()"><option value="">Semua status</option><option>Menipis</option><option>Cukup</option></select></div>
 </div>
 <div class="card stat-card"><div class="table-responsive"><table class="table align-middle mb-0">
  <thead class="table-light"><tr><th>Barang</th><th>Kategori</th><th>Stok</th><th>Min</th><th>Status</th><th class="text-end">Aksi</th></tr></thead><tbody id="tb"></tbody></table></div></div>
</main></div>

<div class="modal fade" id="m" tabindex="-1"><div class="modal-dialog"><form class="modal-content" id="f" novalidate>
 <div class="modal-header"><h5 class="modal-title" id="mt">Form Barang</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
 <div class="modal-body row g-3">
  <div class="col-12"><label class="form-label">Nama barang</label><input id="nama" class="form-control" required><div class="invalid-feedback">Nama wajib diisi.</div></div>
  <div class="col-12"><label class="form-label">Kategori</label><select id="kategori" class="form-select"></select></div>
  <div class="col-4"><label class="form-label">Jumlah stok</label><input id="jumlah" type="number" min="0" class="form-control" required><div class="invalid-feedback">Isi angka &ge; 0.</div></div>
  <div class="col-4"><label class="form-label">Satuan</label><select id="satuan" class="form-select"></select></div>
  <div class="col-4"><label class="form-label">Stok minimum</label><input id="min" type="number" min="0" class="form-control" required><div class="invalid-feedback">Isi angka &ge; 0.</div></div>
  <div class="col-12"><label class="form-label">Catatan</label><input id="catatan" class="form-control" placeholder="Opsional"></div>
 </div>
 <div class="modal-footer"><button type="button" class="btn btn-danger" data-bs-dismiss="modal">Batal</button><button class="btn btn-hijau">Simpan</button></div>
</form></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
guard(); layout('stok');
let data = load('stok'), editId = null;
const modal = new bootstrap.Modal('#m'), $ = id => document.getElementById(id);
$('fk').innerHTML = '<option value="">Semua kategori</option>' + opts(KATEGORI);
$('kategori').innerHTML = opts(KATEGORI); $('satuan').innerHTML = opts(SATUAN);
function save() { DB.set('stok', data); }
function render() {
  const q = $('q').value.toLowerCase(), k = $('fk').value, st = $('fs').value;
  const rows = data.filter(d => d.nama.toLowerCase().includes(q) && (!k || d.kategori === k) && (!st || (d.jumlah <= d.min ? 'Menipis' : 'Cukup') === st));
  $('tb').innerHTML = rows.length ? rows.map(d => { const low = d.jumlah <= d.min;
    return `<tr><td class="fw-semibold">${esc(d.nama)}${d.catatan ? `<div class="small text-muted">${esc(d.catatan)}</div>` : ''}</td><td>${esc(d.kategori)}</td>
    <td>${d.jumlah} ${esc(d.satuan)}</td><td>${d.min} ${esc(d.satuan)}</td>
    <td><span class="badge ${low ? 'badge-menipis' : 'badge-cukup'}">${low ? 'Menipis' : 'Cukup'}</span></td>
    <td class="text-end"><button class="btn btn-sm btn-outline-primary" onclick="openForm(${d.id})">Ubah</button> <button class="btn btn-sm btn-outline-danger" onclick="del(${d.id})">Hapus</button></td></tr>`; }).join('')
    : '<tr><td colspan="6" class="text-center text-muted py-4">Data tidak ditemukan.</td></tr>';
}
function openForm(id) {
  editId = id || null; $('f').classList.remove('was-validated');
  const d = id ? data.find(x => x.id === id) : { nama: '', kategori: KATEGORI[0], jumlah: '', satuan: SATUAN[0], min: '', catatan: '' };
  $('mt').textContent = id ? 'Ubah Barang' : 'Tambah Barang';
  ['nama', 'kategori', 'jumlah', 'satuan', 'min', 'catatan'].forEach(k => $(k).value = d[k]); modal.show();
}
$('f').addEventListener('submit', e => {
  e.preventDefault(); $('f').classList.add('was-validated'); if (!$('f').checkValidity()) return;
  const o = { nama: $('nama').value.trim(), kategori: $('kategori').value, jumlah: +$('jumlah').value, satuan: $('satuan').value, min: +$('min').value, catatan: $('catatan').value.trim() };
  if (!o.nama) return;
  if (editId) { Object.assign(data.find(x => x.id === editId), o); logNotif('Stok produk diperbarui', `${o.nama} kini ${o.jumlah} ${o.satuan}.`, 'stok'); }
  else { data.push({ id: nextId(data), ...o }); logNotif('Barang baru ditambahkan', `${o.nama} (${o.jumlah} ${o.satuan}).`, 'stok'); }
  if (o.jumlah <= o.min) logNotif('Stok hampir habis', `${o.nama} tersisa ${o.jumlah} ${o.satuan}. Periksa dan perbarui stok.`, 'warn');
  save(); modal.hide(); render(); layout('stok'); toast('Data berhasil disimpan');
});
function del(id) {
  const d = data.find(x => x.id === id);
  if (!confirm(`Hapus "${d.nama}"?`)) return;
  data = data.filter(x => x.id !== id); save(); logNotif('Barang dihapus', `${d.nama} dihapus dari daftar stok.`, 'stok'); render(); layout('stok'); toast('Barang dihapus', 'secondary');
}
render();
</script></body></html>
