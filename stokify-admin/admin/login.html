<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login Admin - Stokify</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>body{background:#f8f9fa}.box{max-width:400px;margin:100px auto;padding:24px;background:#fff;border-radius:8px;box-shadow:0 0 10px rgba(0,0,0,.1)}
.btn-hijau{background:#4be24b;border-color:#4be24b;color:#fff}.text-hijau{color:#4be24b}</style></head>
<body><div class="box">
<h2 class="text-center text-hijau">Login Admin</h2>
<p class="text-center text-muted small">Stokify - Panel Pengelola</p>
<div id="err" class="alert alert-danger py-2 d-none"></div>
<form id="f" novalidate>
 <div class="mb-3"><label class="form-label" for="u">Username</label>
  <div class="input-group"><span class="input-group-text"><i class="fas fa-user"></i></span><input id="u" class="form-control" placeholder="Masukkan username" required></div></div>
 <div class="mb-3"><label class="form-label" for="p">Password</label>
  <div class="input-group"><span class="input-group-text"><i class="fas fa-lock"></i></span><input id="p" type="password" class="form-control" placeholder="Masukkan password" required></div></div>
 <button class="btn btn-hijau w-100 mb-3"><i class="fas fa-sign-in-alt"></i> Masuk</button>
</form>
<p class="text-center small text-muted mb-0">Demo: admin / admin123</p>
<div class="text-center mt-3"><a href="../layout.html" class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-left"></i> Kembali ke Beranda</a></div>
</div>
<script>
/* DEMO: kredensial ditulis di front end. Untuk produksi, verifikasi harus di server (hash password + sesi). */
document.getElementById('f').addEventListener('submit', e => {
  e.preventDefault();
  const u = document.getElementById('u').value.trim(), p = document.getElementById('p').value, err = document.getElementById('err');
  if (!u || !p) { err.textContent = 'Username dan password wajib diisi.'; err.classList.remove('d-none'); return; }
  if (u === 'admin' && p === 'admin123') { sessionStorage.setItem('stokify_admin', '1'); sessionStorage.setItem('stokify_user', u); location.href = 'index.html'; }
  else { err.textContent = 'Username atau password salah.'; err.classList.remove('d-none'); }
});
</script></body></html>
