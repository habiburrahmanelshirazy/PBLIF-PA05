<!DOCTYPE html>
<html lang="id"><head><script src="admin.js"></script><script>document.write(HEAD('Pengguna'))</script></head>
<body>
<div id="topnav"></div>
<div class="admin-wrap"><aside class="admin-side" id="side"></aside>
<main class="admin-main">
 <div class="d-flex justify-content-between align-items-center mb-3"><h3 class="mb-0">Kelola Pengguna</h3>
  <button class="btn btn-hijau" onclick="openForm()"><i class="fas fa-plus"></i> Tambah Pengguna</button></div>
 <input id="q" class="form-control mb-3" placeholder="Cari username atau nama..." oninput="render()">
 <div class="card stat-card"><div class="table-responsive"><table class="table align-middle mb-0">
  <thead class="table-light"><tr><th>Username</th><th>Nama</th><th>Peran</th><th>Status</th><th class="text-end">Aksi</th></tr></thead><tbody id="tb"></tbody></table></div></div>
</main></div>

<div class="modal fade" id="m" tabindex="-1"><div class="modal-dialog"><form class="modal-content" id="f" novalidate>
 <div class="modal-header"><h5 class="modal-title" id="mt">Form Pengguna</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
 <div class="modal-body row g-3">
  <div class="col-12"><label class="form-label">Username</label><input id="username" class="form-control" pattern="[A-Za-z0-9_]{3,}" required><div class="invalid-feedback" id="ue">Min. 3 karakter (huruf, angka, _).</div></div>
  <div class="col-12"><label class="form-label">Nama lengkap</label><input id="nama" class="form-control" required><div class="invalid-feedback">Nama wajib diisi.</div></div>
  <div class="col-6"><label class="form-label">Peran</label><select id="peran" class="form-select"><option>Admin</option><option>Anggota</option></select></div>
  <div class="col-6"><label class="form-label">Status</label><select id="status" class="form-select"><option>Aktif</option><option>Nonaktif</option></select></div>
 </div>
 <div class="modal-footer"><button type="button" class="btn btn-danger" data-bs-dismiss="modal">Batal</button><button class="btn btn-hijau">Simpan</button></div>
</form></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
guard(); layout('pengguna');
let data = load('pengguna'), editId = null;
const modal = new bootstrap.Modal('#m'), $ = id => document.getElementById(id), save = () => DB.set('pengguna', data);
function render() {
  const q = $('q').value.toLowerCase();
  const rows = data.filter(d => d.username.toLowerCase().includes(q) || d.nama.toLowerCase().includes(q));
  $('tb').innerHTML = rows.length ? rows.map(d => `<tr><td class="fw-semibold">${esc(d.username)}</td><td>${esc(d.nama)}</td>
   <td><span class="badge ${d.peran === 'Admin' ? 'text-bg-dark' : 'text-bg-secondary'}">${esc(d.peran)}</span></td>
   <td><span class="badge ${d.status === 'Aktif' ? 'badge-cukup' : 'badge-menipis'}">${esc(d.status)}</span></td>
   <td class="text-end"><button class="btn btn-sm btn-outline-primary" onclick="openForm(${d.id})">Ubah</button> <button class="btn btn-sm btn-outline-danger" onclick="del(${d.id})">Hapus</button></td></tr>`).join('')
   : '<tr><td colspan="5" class="text-center text-muted py-4">Pengguna tidak ditemukan.</td></tr>';
}
function openForm(id) {
  editId = id || null; $('f').classList.remove('was-validated'); $('username').setCustomValidity('');
  const d = id ? data.find(x => x.id === id) : { username: '', nama: '', peran: 'Anggota', status: 'Aktif' };
  $('mt').textContent = id ? 'Ubah Pengguna' : 'Tambah Pengguna';
  ['username', 'nama', 'peran', 'status'].forEach(k => $(k).value = d[k]); modal.show();
}
$('username').addEventListener('input', () => $('username').setCustomValidity(''));
$('f').addEventListener('submit', e => {
  e.preventDefault();
  const o = { username: $('username').value.trim(), nama: $('nama').value.trim(), peran: $('peran').value, status: $('status').value };
  if (data.some(x => x.username.toLowerCase() === o.username.toLowerCase() && x.id !== editId)) { $('username').setCustomValidity('dup'); $('ue').textContent = 'Username sudah dipakai.'; }
  $('f').classList.add('was-validated'); if (!$('f').checkValidity() || !o.nama) return;
  if (editId) { const cur = data.find(x => x.id === editId);
    const admins = data.filter(x => x.peran === 'Admin' && x.status === 'Aktif');
    if (cur.peran === 'Admin' && (o.peran !== 'Admin' || o.status !== 'Aktif') && admins.length === 1) { toast('Minimal harus ada satu admin aktif', 'danger'); return; }
    Object.assign(cur, o); }
  else data.push({ id: nextId(data), ...o });
  save(); modal.hide(); render(); toast('Pengguna disimpan');
});
function del(id) {
  const d = data.find(x => x.id === id);
  if (d.peran === 'Admin' && data.filter(x => x.peran === 'Admin').length === 1) { toast('Admin terakhir tidak bisa dihapus', 'danger'); return; }
  if (d.username === sessionStorage.getItem('stokify_user')) { toast('Tidak bisa menghapus akun yang sedang dipakai', 'danger'); return; }
  if (!confirm(`Hapus pengguna "${d.username}"?`)) return; data = data.filter(x => x.id !== id); save(); render(); toast('Pengguna dihapus', 'secondary');
}
render();
</script></body></html>
