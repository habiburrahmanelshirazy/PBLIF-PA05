<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login Page - Stokify</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .login-container {
            max-width: 400px;
            margin: auto;
            margin-top: 100px;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            color: #030800;
        }

        .login-container h2 {
            margin-bottom: 20px;
        }

        .btn-hijau {
            background-color: #4be24b;
            border-color: #4be24b;
            color: #fff;

        }

        .text-hijau {
            color: #4be24b;
        }


        .link-hijau {
            color: #4be24b;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <h2 class="text-center text-hijau">Login</h2>

        <!-- Form submit akan mengarahkan ke halaman layout.html -->
        <form action="layout.html" method="GET">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input type="text" class="form-control" id="username" placeholder="Masukkan username" required>
                </div>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" class="form-control" id="password" placeholder="Masukkan password" required>
                </div>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe">
                <label class="form-check-label" for="rememberMe">Ingatkan Saya</label>
            </div>
            <button type="submit" class="btn btn-hijau w-100 mb-3">
                <i class="fas fa-sign-in-alt"></i> Masuk
            </button>
        </form>

        <p class="text-center mt-2">
            <a href="#" class="link-hijau text-decoration-none">Lupa Password?</a>
        </p>
        <p class="text-center">Belum punya akun? <a href="#" class="link-hijau text-decoration-none">Daftar
                Sekarang</a></p>

        <!-- Tautan Kembali ke Beranda Utama -->
        <div class="text-center mt-3">
            <a href="layout.html" class="btn btn-outline-secondary btn-sm">
                <i class="fas fa-arrow-left"></i> Kembali ke Beranda
            </a>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
